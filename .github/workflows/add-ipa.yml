name: Add IPA project from phone

on:
  issues:
    types: [opened]

# Only the repository owner can open a request that runs the write job.
# The owner is read from the event context, never hardcoded, so forks and
# renamed accounts keep working.
permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: add-ipa-source-config
  cancel-in-progress: false

jobs:
  add-project:
    if: github.actor == github.repository_owner && github.event.issue.user.login == github.repository_owner && github.event.issue.title == '[IPA Source] Add project'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Restore IPA metadata cache
        uses: actions/cache@v4
        with:
          path: .cache/metadata.json
          key: ipa-meta-v2-main-add-${{ github.run_id }}
          restore-keys: |
            ipa-meta-v2-main-
      - name: Validate request, check IPA, and update config
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/add_request.py --event "$GITHUB_EVENT_PATH" --commit
      - name: Comment that validation passed and publication is starting
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          echo "DISPATCH_AFTER=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          gh issue comment "$ISSUE_NUMBER" --body "⏳ 已通过校验并加入配置，正在发布…发布完成后会在这里给出最终结果。"
      - name: Request source re-publication
        id: dispatch_step
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/dispatch_publish.py
      - name: Wait for the publication run to finish
        id: publish_wait
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list --workflow publish.yml --event workflow_dispatch --limit 10 \
              --json databaseId,createdAt \
              --jq "[.[] | select(.createdAt >= \"$DISPATCH_AFTER\")] | first | .databaseId // empty")
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "Publication run did not appear in time" >&2
            exit 1
          fi
          echo "Watching publication run $run_id"
          gh run watch "$run_id" --exit-status --interval 20
      - name: Comment the final success state and close
        if: steps.publish_wait.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/source.json
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "✅ 添加成功，源已发布完成。订阅地址：$SOURCE_URL —— 回到 LiveContainer 刷新源即可看到新应用；源首页也会显示“添加成功”状态。"
          gh issue close "$ISSUE_NUMBER" --reason completed
      - name: Comment the final failure state
        if: steps.publish_wait.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "❌ 配置已加入，但这次发布没有成功。源仍是上一个版本，没有被破坏；请查看 Actions 里 “Update and publish IPA source” 的运行日志，修复后手动重跑即可。Issue 保持打开，方便跟踪。"
      - name: Report rejected request without leaking data
        if: failure() && steps.dispatch_step.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "This request did not complete validation or publication. Check this workflow run's logs; the source may need owner review before retrying. Do not repost private URLs or credentials."
